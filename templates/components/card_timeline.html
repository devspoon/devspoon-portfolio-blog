{% comment %}Timeline item (ADR-005). Args: title, period (optional), text, h (heading level, default 3).{% endcomment %}
<article class="c-card c-card--timeline">
  {% if period %}<span class="c-card__kind">{{ period }}</span>{% endif %}
  <h{{ h|default:3 }} class="c-card__title">{{ title }}</h{{ h|default:3 }}>
  <p class="c-card__excerpt">{{ text }}</p>
</article>
