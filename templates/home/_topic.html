{% comment %}Study/plan card on home. Args: t (title), d (text), icon (flaticon name).{% endcomment %}
<div class="col-md-6 col-lg-3">
    <div class="media block-6 services d-block bg-white rounded-lg shadow ftco-animate">
        <div class="icon shadow d-flex align-items-center justify-content-center"><span class="flaticon-{{ icon }}" aria-hidden="true"></span></div>
        <div class="media-body">
            <h3 class="heading mb-3">{{ t }}</h3>
            <p>{{ d }}</p>
        </div>
    </div>
</div>
