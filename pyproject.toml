[tool.poetry]
name = "devspoon-portfolio-blog"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
Django = "~5.2"
django-decouple = "^2.1"
django-redis = "^7.0.0"
pymysql = "^1.2.4"
django-cors-headers = "^4.9.0"
django-mptt = "^0.21.1"
django-anymail = "^15.2"
django-imagekit = "^6.1.1"
django-admin-rangefilter = "^0.15.0"
django-user-agents = "^0.4.0"
django-summernote = "^0.8.20.0"
django-allauth = {version = "^65.22.0", extras = ["socialaccount"]}
django-recaptcha = "^4.1.0"
psycopg2-binary = "^2.9.13"
beautifulsoup4 = "^4.15.0"
django-braces = "^1.17.0"
email-validator = "^2.3.0"
django-request-logging = "^0.7.5"
django-sendgrid-v5 = "^1.3.1"
python-gettext = "^5.0"
uvicorn = "^0.54.0"
daphne = "^4.2.3"
py3-validate-email = "^1.0.5.post2"
nh3 = "^0.3.7"


[tool.poetry.group.dev.dependencies]
isort = "^9.0.2"
django-debug-toolbar = "^8.0.0"
django-extensions = "^4.1"
django-silk = "^5.6.0"
celery = "^5.7.0"
django-celery-beat = "^2.9.0"
django-celery-results = "^2.6.0"
djlint = "~1.36"


[tool.poetry.group.test.dependencies]
coverage = "^7.17.2"
django-silk = "^5.6.0"
pytest-django = "^4.14.0"
pytest-factoryboy = "^2.8.1"


[tool.poetry.group.stage.dependencies]
celery = "^5.7.0"
django-celery-beat = "^2.9.0"
django-celery-results = "^2.6.0"
sentry-sdk = "^2.74.0"


[tool.djlint]
# Lint template structure (unclosed tags, nested links/buttons, duplicate attributes, alt, button type).
# Pure formatting rules are ignored; mail templates need inline styles, admin templates follow Django's.
# usage: djlint templates --lint
profile = "django"
extend_exclude = "templates/admin,templates/email"
ignore = "T001,T003,T032,T045,H006,H008,H014,H020,H021,H029,H030,H031"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
